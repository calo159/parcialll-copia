<text x="10" y="20" font-size="14" font-weight="bold">Diagrama de clases UML · Patrón Estrategia aplicado a las zonas (v2.0.0)</text><rect x="20" y="60" width="250" height="150" fill="#fff8e1" stroke="#7c2d12" stroke-width="1.5"/><text x="145" y="74" text-anchor="middle" font-size="11">«module»</text><text x="145" y="90" text-anchor="middle" font-weight="bold">envios (módulo / Contexto)</text><line x1="20" y1="98" x2="270" y2="98" stroke="#7c2d12"/><text x="26" y="114">ESTRATEGIAS_ZONA : Map&lt;string, EstrategiaZona&gt;</text><line x1="20" y1="122" x2="270" y2="122" stroke="#7c2d12"/><text x="26" y="138">+ calc(peso, zona, cliente, dia, cupon) : number</text><text x="26" y="154">- obtenerEstrategiaZona(zona) : EstrategiaZona</text><text x="26" y="170">- tarifaBase(peso) : number</text><text x="26" y="186">- aplicarDescuentos(c, cli, cup) : number</text><text x="26" y="202">- redondear(costo) : number</text><rect x="420" y="60" width="260" height="86" fill="#fff8e1" stroke="#7c2d12" stroke-width="1.5"/><text x="550" y="74" text-anchor="middle" font-size="11">«abstract»</text><text x="550" y="90" text-anchor="middle" font-weight="bold" font-style="italic">EstrategiaZona</text><line x1="420" y1="98" x2="680" y2="98" stroke="#7c2d12"/><text x="426" y="114"></text><line x1="420" y1="122" x2="680" y2="122" stroke="#7c2d12"/><text x="426" y="138">+ aplicarRecargo(tarifa) : number</text><rect x="330" y="250" width="200" height="74" fill="#fff8e1" stroke="#7c2d12" stroke-width="1.5"/><text x="430" y="268" text-anchor="middle" font-weight="bold">ZonaUrbana</text><line x1="330" y1="276" x2="530" y2="276" stroke="#7c2d12"/><text x="336" y="292"></text><line x1="330" y1="300" x2="530" y2="300" stroke="#7c2d12"/><text x="336" y="316">+ aplicarRecargo(tarifa) : number</text><rect x="570" y="250" width="230" height="90" fill="#fff8e1" stroke="#7c2d12" stroke-width="1.5"/><text x="685" y="268" text-anchor="middle" font-weight="bold">ZonaConRecargo</text><line x1="570" y1="276" x2="800" y2="276" stroke="#7c2d12"/><text x="576" y="292">- porcentaje : number</text><line x1="570" y1="300" x2="800" y2="300" stroke="#7c2d12"/><text x="576" y="316">+ constructor(porcentaje)</text><text x="576" y="332">+ aplicarRecargo(tarifa) : number</text><rect x="440" y="420" width="140" height="74" fill="#fff8e1" stroke="#7c2d12" stroke-width="1.5"/><text x="510" y="438" text-anchor="middle" font-weight="bold">ZonaRural</text><line x1="440" y1="446" x2="580" y2="446" stroke="#7c2d12"/><text x="446" y="462"></text><line x1="440" y1="470" x2="580" y2="470" stroke="#7c2d12"/><text x="446" y="486">porcentaje = 0.20</text><rect x="600" y="420" width="140" height="74" fill="#fff8e1" stroke="#7c2d12" stroke-width="1.5"/><text x="670" y="438" text-anchor="middle" font-weight="bold">ZonaNacional</text><line x1="600" y1="446" x2="740" y2="446" stroke="#7c2d12"/><text x="606" y="462"></text><line x1="600" y1="470" x2="740" y2="470" stroke="#7c2d12"/><text x="606" y="486">porcentaje = 0.50</text><path d="M430,250 L430,235 L550,235 L550,146" fill="none" stroke="#333" marker-end="url(#her)"/><path d="M685,250 L685,235 L550,235 L550,146" fill="none" stroke="#333" marker-end="url(#her)"/><path d="M510,420 L510,405 L685,405 L685,340" fill="none" stroke="#333" marker-end="url(#her)"/><path d="M670,420 L670,405 L685,405 L685,340" fill="none" stroke="#333" marker-end="url(#her)"/><path d="M270,100 L420,100" stroke="#333" fill="none" marker-start="url(#agg)" marker-end="url(#dep)"/>
<text x="300" y="94">usa 1..* estrategias</text>
<text x="20" y="240" font-size="11">calc delega el recargo por zona en la estrategia registrada;</text>
<text x="20" y="256" font-size="11">agregar una zona = nueva subclase + 1 entrada en el Map (abierto/cerrado).</text></svg>